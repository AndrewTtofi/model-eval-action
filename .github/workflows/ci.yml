name: ci
on:
  push: { branches: [main] }
  pull_request:

# Least privilege. No secrets: the action is tested on its own deterministic stubs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (a tag can be moved; a SHA can't). Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: make install
      - run: make lint
      - run: make test
      - name: known vulnerabilities in the locked dependencies
        run: make audit
      - name: lockfiles match requirements
        run: make lock && git diff --exit-code -- requirements.txt requirements-dev.txt

  # The action itself, as a caller would use it, on its own stubs. Three runs: one that
  # must pass, one that must report a regression, one that must report a budget breach.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # the clean run posts its report on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: a candidate as good as the current model passes
        id: clean
        uses: ./
        with:
          golden: examples/golden.yaml
          prices: examples/prices.yaml
          current: stub/baseline
          candidate: stub/baseline
          offline: "true"

      - name: a worse candidate is reported as a regression
        id: regressed
        uses: ./
        with:
          golden: examples/golden.yaml
          prices: examples/prices.yaml
          current: stub/baseline
          candidate: stub/regressed
          offline: "true"
          comment: "false"
          fail-on: never

      - name: a candidate that costs too much is reported as over budget
        id: costly
        uses: ./
        with:
          golden: examples/golden.yaml
          prices: examples/prices.yaml
          current: stub/baseline
          candidate: stub/costly
          max-cost-ratio: "2"
          offline: "true"
          comment: "false"
          fail-on: never

      - name: the three verdicts are what they should be
        env:
          CLEAN: ${{ steps.clean.outputs.verdict }}
          REGRESSED: ${{ steps.regressed.outputs.verdict }}
          REGRESSIONS: ${{ steps.regressed.outputs.regressions }}
          COSTLY: ${{ steps.costly.outputs.verdict }}
        run: |
          echo "clean=$CLEAN regressed=$REGRESSED ($REGRESSIONS) costly=$COSTLY"
          [ "$CLEAN" = "pass" ] && [ "$REGRESSED" = "regression" ] && [ "$REGRESSIONS" = "4" ] && [ "$COSTLY" = "over budget" ]
